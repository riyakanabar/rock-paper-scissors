<!DOCTYPE html>
<html>
    <head>
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Asap+Sharp:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <h1 class="title">Rock Paper Scissors</h1>
        <div>
        <button class="move-button rock-button" onclick="playGame('rock')"><img class="move-icon" src="images/rock.png"></button>
        <button class="move-button paper-button" onclick="playGame('paper')"><img class="move-icon" src="images/paper.png"></button>
        <button class="move-button scissors-button" onclick="playGame('scissors')"><img src="images/scissors.png" class="move-icon"></button>
        </div>
        <p class="js-result result"></p>
        <p class="js-moves moves"></p>  
        <p class="js-score score"></p>
 
        <button class="reset-score-button" onclick="resetScore()">Reset Score</button>

        <script src="game.js"></script>
    </body>


</html>
