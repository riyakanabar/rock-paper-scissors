<!DOCTYPE html>
<html>
    <head>
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Asap+Sharp:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <h1 class="title">Rock Paper Scissors</h1>
        <button class="move-button rock-button" onclick="playGame('rock')"><img class="move-icon" src="images/rock.png"></button>
        <button class="move-button paper-button" onclick="playGame('paper')"><img class="move-icon" src="images/paper.png"></button>
        <button class="move-button scissors-button" onclick="playGame('scissors')"><img src="images/scissors.png" class="move-icon"></button>

        <p class="js-result result"></p>
        <p class="js-moves moves"></p>  
        <p class="js-score score"></p>
 
        <button class="reset-score-button" onclick="resetScore()">Reset Score</button>

        <script>
            let score = JSON.parse(localStorage.getItem('score')) || {
                wins: 0,
                losses: 0,
                ties: 0
            };

            updateScoreElement();


            function updateScoreElement(){
                document.querySelector('.js-score').innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
            }
            
    
            function pickComputerMove(){
                const randomNumber = Math.random();
                if(randomNumber < 1/3){
                    return 'rock';
                }
                else if(randomNumber < 2/3){
                    return 'paper';
                }
                else{
                    return 'scissors';
                }
            } 
            function playGame(playerMove){
                const computerMove = pickComputerMove();
                let result;
                if(playerMove === computerMove){
                    result = 'Draw!'
                    score.ties++;
                }
                else if(
                    (playerMove === 'rock' && computerMove === 'scissors') ||
                    (playerMove === 'paper' && computerMove === 'rock') ||
                    (playerMove === 'scissors' && computerMove === 'paper')
                ){
                    result = 'You Win!'
                    score.wins++;
                }else{
                    result = 'You Lose!'
                    score.losses++;
                }
                localStorage.setItem('score', JSON.stringify(score))
                updateScoreElement();
                document.querySelector('.js-result').innerHTML = `${result}`;
                document.querySelector('.js-moves').innerHTML = `You <img class="move-icon moves" src="images/${playerMove}.png"> <img class="move-icon moves" src="images/${computerMove}.png"> Computer`;
                updateMovesElement(playerMove, computerMove);
            }

            function resetScore(){
                score.wins = 0;
                score.losses = 0;
                score.ties = 0;
                localStorage.removeItem('score');
                updateScoreElement();
            }  
        </script>
    </body>


</html>
